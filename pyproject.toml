[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gha-bill"
version = "0.1.0"
description = "Know what your GitHub Actions cost per workflow and per month."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Indra Prasetya" }]
keywords = ["github-actions", "ci", "cost", "billing", "cli", "devops"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gha-bill = "gha_bill.cli:main"

[project.urls]
Homepage = "https://github.com/indraoverflow/gha-bill"
Issues = "https://github.com/indraoverflow/gha-bill/issues"
Changelog = "https://github.com/indraoverflow/gha-bill/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gha_bill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
